server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Seguridad básica
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 512;

    # Sitio principal — juanbalza.com / www.juanbalza.com
    location / {
        try_files $uri $uri/ $uri.html =404;
        # El HTML nunca se cachea: cualquier proxy/CDN o navegador debe
        # revalidar en cada visita para que los cambios se vean al instante.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Landing "Vende lo que sabes" — accesible solo por URL directa,
    # no está enlazada desde la navegación del sitio principal.
    location = /vende-lo-que-sabes {
        return 301 /vende-lo-que-sabes/;
    }
    location /vende-lo-que-sabes/ {
        try_files $uri $uri/ /vende-lo-que-sabes/index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # CSS/JS: cache corto (revalida seguido) para que un cambio de estilos
    # no deje a nadie con una versión vieja durante días.
    location ~* \.(?:css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        access_log off;
    }

    # Imágenes/fuentes: cache largo, son archivos versionables por nombre.
    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }
}
