server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Seguridad básica
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 512;

    # Sitio principal — juanbalza.com / www.juanbalza.com
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Landing "Vende lo que sabes" — accesible solo por URL directa,
    # no está enlazada desde la navegación del sitio principal.
    location = /vende-lo-que-sabes {
        return 301 /vende-lo-que-sabes/;
    }
    location /vende-lo-que-sabes/ {
        try_files $uri $uri/ /vende-lo-que-sabes/index.html;
    }

    # Cache largo para assets estáticos versionables
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }
}
